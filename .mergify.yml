pull_request_rules:
  - name: queue on label
    conditions:
      - label = ready-to-merge
    actions:
      queue:
        name: default

queue_rules:
  - name: default
    batch_size: 5
    merge_method: merge
    queue_conditions:
      - base = main
      - check-success = check
    merge_conditions:
      - check-success = merge-queue
      - check-success = e2e
