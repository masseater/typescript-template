name: skills-lock
description: On a renovate push, fail while skills-lock.json has stale hashes and ask main to rehash; on that workflow_dispatch, push the rehashed lock with the GitHub App token from credentials.masseater.dev
inputs:
  branch:
    description: The renovate branch that is checked out
    required: true
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: true
        run-install: |
          - args: ['--frozen-lockfile', '--ignore-scripts']
    - shell: bash
      run: vp exec skills experimental_install --force --no-frozen-lockfile
    - id: stale
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        if git diff --quiet -- skills-lock.json; then
          exit 0
        fi
        echo "stale=true" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          gh workflow run skills-lock.yml --repo "$GITHUB_REPOSITORY" --ref main -f branch="$BRANCH"
          echo "::error::skills-lock.json does not match the skill refs; the rehash runs from main and pushes a new commit"
          exit 1
        fi
    - if: steps.stale.outputs.stale == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../credentials/credentials.sh"'
    - if: steps.stale.outputs.stale == 'true'
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        if [ -z "${GITHUB_APP_TOKEN:-}" ]; then
          echo "::error::credentials.masseater.dev issued no GitHub App token; a push with GITHUB_TOKEN leaves the up-to-date check waiting for approval"
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "fix(deps): skills-lock.json のハッシュを新しい ref に合わせる" -- skills-lock.json
        export GH_TOKEN="$GITHUB_APP_TOKEN"
        gh auth setup-git
        git push origin "HEAD:refs/heads/${BRANCH}"
