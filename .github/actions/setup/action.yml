name: setup
description: Install the toolchain and the dependencies that verify needs in this repository
inputs:
  cache:
    description: Whether setup-vp restores its cache
    default: "true"
runs:
  using: composite
  steps:
    - if: ${{ env.TAKUMI_GUARD_TOKEN != '' }}
      shell: bash
      env:
        TOKEN: ${{ env.TAKUMI_GUARD_TOKEN }}
      run: printf '//npm.flatt.tech/:_authToken=%s\n' "$TOKEN" >> "$HOME/.npmrc"
    - id: lockfile-verified
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    - id: checkout
      shell: bash
      run: |
        root="/home/user/${GITHUB_REPOSITORY#*/}"
        if [ "$GITHUB_WORKSPACE" -ef "$root" ]; then
          echo "directory=$root" >> "$GITHUB_OUTPUT"
        else
          echo "directory=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
        fi
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        working-directory: ${{ steps.checkout.outputs.directory }}
        cache: ${{ inputs.cache }}
        run-install: |
          - args: ['--frozen-lockfile']
    - if: ${{ steps.lockfile-verified.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
