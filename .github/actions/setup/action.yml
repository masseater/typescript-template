name: setup
description: Install the toolchain and the dependencies that verify needs in this repository
inputs:
  cache:
    description: Whether setup-vp restores its cache
    default: "true"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: ${{ inputs.cache }}
        run-install: |
          - args: ['--frozen-lockfile']
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
