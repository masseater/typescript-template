name: setup
description: Install the toolchain and the dependencies that verify needs in this repository
inputs:
  cache:
    description: Whether setup-vp restores its cache
    default: "true"
runs:
  using: composite
  steps:
    - if: ${{ env.TAKUMI_GUARD_TOKEN != '' }}
      shell: bash
      env:
        TOKEN: ${{ env.TAKUMI_GUARD_TOKEN }}
      run: printf '//npm.flatt.tech/:_authToken=%s\n' "$TOKEN" >> "$HOME/.npmrc"
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: ${{ inputs.cache }}
        run-install: |
          - args: ['--frozen-lockfile']
