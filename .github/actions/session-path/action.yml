name: session-path
description: Right after checkout, move the checkout to /home/user/<repository>, where cloud sessions check out, and mount it back at the workspace, so that the one install of the setup action runs under the paths that cache keys hold and still hard links from the package store, while actions keep finding the workspace where the runner put it
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        root="/home/user/${GITHUB_REPOSITORY#*/}"
        sudo mkdir -p "${root%/*}"
        sudo mv "$GITHUB_WORKSPACE" "$root"
        mkdir "$GITHUB_WORKSPACE"
        sudo mount --bind "$root" "$GITHUB_WORKSPACE"
