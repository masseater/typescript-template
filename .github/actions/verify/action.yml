name: verify
description: After the repository's setup action, fetch the pushed commits and run vp run verify against them with the decision cache and the Vite Task cache of earlier runs, from /home/user/<repository> where cloud sessions check out so that cache keys hold the same paths (the checkout that the setup action moved there with session-path, or else a bind mount with a second install), going on with each task verify depends on after a failure so that the cache fills, and on the default branch of a public repository publish those caches as an artifact for cloud sessions
inputs:
  github-token:
    description: A token that can read this repository, and its Actions caches when shards is more than 1
    required: true
  full-history:
    description: Whether to fetch the whole history before verify, for builds that read commit dates and checks that read the changes of past commits
    default: "false"
  share:
    description: Whether this job publishes the caches for cloud sessions, so that only one job of a run does
    default: "true"
  shard:
    description: Which of the shards this job runs, counted from 0
    default: "0"
  shards:
    description: How many jobs split the tasks verify depends on, each running its share and reporting it for verify-shards to check
    default: "1"
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../credentials/credentials.ts"
    - if: github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        gh auth setup-git
        commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
        git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/oxlint-plugin-decision
        key: oxlint-plugin-decision-${{ github.sha }}
        restore-keys: oxlint-plugin-decision-
    - id: durations
      if: inputs.shards != '1'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/durations-key.ts"
    - id: durations-restore
      if: inputs.shards != '1'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/verify-durations
        key: ${{ steps.durations.outputs.key }}
    - id: durations-wait
      if: inputs.shards != '1' && steps.durations-restore.outputs.cache-hit != 'true' && !endsWith(steps.durations.outputs.key, '-none')
      shell: bash
      run: sleep 20
    - id: durations-retry
      if: steps.durations-wait.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/verify-durations
        key: ${{ steps.durations.outputs.key }}
    - if: steps.durations-wait.outcome == 'success' && steps.durations-retry.outputs.cache-hit != 'true'
      shell: bash
      env:
        KEY: ${{ steps.durations.outputs.key }}
      run: echo "::error::The durations cache $KEY is listed but could not be restored, so this shard would split differently from the others" && exit 1
    - id: task-cache
      if: github.event_name != 'schedule'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.shard }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.full-history == 'true'
      shell: bash
      run: git fetch --unshallow origin
    - id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VPA_BASE: ${{ github.event.before }}
        VERIFY_SHARD: ${{ inputs.shard }}
        VERIFY_SHARDS: ${{ inputs.shards }}
        VERIFY_DURATIONS: ${{ runner.temp }}/verify-durations/durations.json
        VERIFY_SHARD_REPORT: ${{ runner.temp }}/verify-shard/report.json
      run: |
        root="/home/user/${GITHUB_REPOSITORY#*/}"
        moved=true
        if ! [ "$GITHUB_WORKSPACE" -ef "$root" ]; then
          moved=false
          sudo mkdir -p "$root"
          sudo mount --bind "$GITHUB_WORKSPACE" "$root"
        fi
        cd "$root"
        export PATH="${PATH//"$GITHUB_WORKSPACE"/$root}"
        "$moved" || vp install --frozen-lockfile
        node "$GITHUB_ACTION_PATH/verify.ts"
    - if: always() && steps.verify.outcome != 'skipped'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/oxlint-plugin-decision
        key: oxlint-plugin-decision-${{ github.sha }}
    - if: always() && steps.verify.outcome != 'skipped' && steps.task-cache.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: ${{ steps.task-cache.outputs.cache-primary-key }}
    - if: always() && inputs.shards != '1' && steps.verify.outcome != 'skipped'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verify-shard-${{ inputs.shard }}
        path: ${{ runner.temp }}/verify-shard/report.json
        retention-days: 1
    - id: share
      if: always() && inputs.share == 'true' && steps.verify.outcome != 'skipped' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && !github.event.repository.private
      shell: bash
      run: find . -path ./node_modules/.pnpm -prune -o -type d -path '*/node_modules/.cache' -print -prune | tar -cf vp-cache.tar --ignore-failed-read -T - node_modules/.vite/task-cache
    - if: always() && steps.share.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: vp-cache.tar
        archive: false
        retention-days: 1
