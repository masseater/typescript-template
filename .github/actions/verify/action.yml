name: verify
description: After the repository's setup action, fetch the pushed commits and run vp run verify against them with the decision cache and the Vite Task cache of earlier runs, and on the default branch of a public repository publish that Vite Task cache and the tool caches under every node_modules/.cache as an artifact for cloud sessions
inputs:
  github-token:
    description: A token that can read this repository
    required: true
  full-history:
    description: Whether to fetch the whole history without blobs before verify, for builds that read commit dates
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../credentials/credentials.ts"
    - if: github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        gh auth setup-git
        commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
        git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/oxlint-plugin-decision
        key: oxlint-plugin-decision-${{ github.sha }}
        restore-keys: oxlint-plugin-decision-
    - id: task-cache
      if: github.event_name != 'schedule'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.full-history == 'true'
      shell: bash
      run: git fetch --unshallow --filter=blob:none origin
    - id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VPA_BASE: ${{ github.event.before }}
      run: vp run --log grouped verify
    - if: always() && steps.verify.outcome != 'skipped'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/oxlint-plugin-decision
        key: oxlint-plugin-decision-${{ github.sha }}
    - if: always() && steps.verify.outcome != 'skipped' && steps.task-cache.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: ${{ steps.task-cache.outputs.cache-primary-key }}
    - id: share
      if: always() && steps.verify.outcome != 'skipped' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && !github.event.repository.private
      shell: bash
      run: find . -path ./node_modules/.pnpm -prune -o -type d -path '*/node_modules/.cache' -print -prune | tar -cf vp-cache.tar --ignore-failed-read -T - node_modules/.vite/task-cache
    - if: always() && steps.share.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: vp-cache.tar
        archive: false
        retention-days: 1
