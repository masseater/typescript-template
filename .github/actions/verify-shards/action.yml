name: verify-shards
description: After the shard jobs of the verify action, fail unless every shard passed, every shard of the count they report sent its report, and all of them split the tasks the same way, so that no task went unrun, and save the durations they measured for the next run to split by
inputs:
  result:
    description: The result of the shard jobs, needs.<job>.result
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: verify-shard-*
        path: ${{ runner.temp }}/verify-shards
    - id: check
      shell: bash
      env:
        VERIFY_RESULT: ${{ inputs.result }}
        VERIFY_REPORTS: ${{ runner.temp }}/verify-shards
        VERIFY_DURATIONS: ${{ runner.temp }}/verify-durations/durations.json
      run: node "$GITHUB_ACTION_PATH/verify-shards.ts"
    - if: always() && steps.check.outcome != 'skipped'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/verify-durations
        key: verify-durations-${{ github.run_id }}-${{ github.run_attempt }}
