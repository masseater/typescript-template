name: update-branches
description: Act as the merge queue for pull requests with auto-merge on. Remove a pull request that conflicts with the default branch or fails a required check from the queue by turning its auto-merge off, and comment the reason on it. When no other pull request is on its way to merging, bring the one that turned auto-merge on first and is behind the default branch up to date, so the required checks run once on top of the newest main and auto-merge lands it before the next one starts
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../credentials/credentials.ts"
    - shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/update-branches.ts"
