name: update-branches
description: Act as the merge queue. Every pull request that is not a draft joins by itself. Merge the ones whose required checks passed and that do not conflict, bottom of a stack first, in one burst, and retarget a stacked pull request to the default branch when the one below it has merged. A pull request waits for any open pull request whose head it contains or whose branch it targets. Comment once per head commit on a pull request that conflicts or fails a required check
inputs:
  verify-workflow:
    description: Workflow file that runs the verify job on the default branch
    default: verify.yml
  verify-job:
    description: Job whose latest finished result on the default branch decides whether main is red. While it is red, pull requests opened by bots stay behind and only fixes move
    default: verify
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../credentials/credentials.ts"
    - shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        VERIFY_WORKFLOW: ${{ inputs.verify-workflow }}
        VERIFY_JOB: ${{ inputs.verify-job }}
      run: node "$GITHUB_ACTION_PATH/update-branches.ts"
