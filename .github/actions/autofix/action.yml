name: autofix
description: After the repository's setup action, have Claude fix the failed verify run on the checked-out branch and push the fix
inputs:
  run-id:
    description: The verify run that failed
    required: true
  branch:
    description: The branch the failed run verified
    required: true
  sha:
    description: The commit the failed run verified
    required: true
  github-token:
    description: A token that can push, open pull requests, and read runs
    required: true
runs:
  using: composite
  steps:
    - id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_BRANCH: ${{ inputs.branch }}
        HEAD_SHA: ${{ inputs.sha }}
        FAILED_RUN_ID: ${{ inputs.run-id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
          branch="claude/fix-verify-$FAILED_RUN_ID"
          git switch -c "$branch"
        else
          branch="$HEAD_BRANCH"
        fi
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "failed_job=$(gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "verify") | .databaseId')" >> "$GITHUB_OUTPUT"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - if: steps.target.outputs.stale != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../credentials/credentials.sh"'
    - if: steps.target.outputs.stale != 'true'
      uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
      with:
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: renovate,github-actions
        prompt: |
          The verify job failed on branch ${{ inputs.branch }} (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run-id }}).
          The working tree is checked out on branch ${{ steps.target.outputs.branch }}.

          1. Read the failure with `gh run view --job ${{ steps.target.outputs.failed_job }} --log-failed`.
          2. Fix the root cause in the code, following AGENTS.md. Do not weaken lint rules, add disable directives, or skip checks to make verify pass. Do not downgrade any dependency, and never move `typescript` below 7.
          3. Run `vp run verify` and repeat until it passes.
          4. Commit the fix with a Conventional Commits message whose body explains the cause. Do not push.
        claude_args: >-
          --max-turns 200
          --model claude-opus-5-5
          --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
    - if: steps.target.outputs.stale != 'true'
      shell: bash
      env:
        BRANCH: ${{ steps.target.outputs.branch }}
        HEAD_BRANCH: ${{ inputs.branch }}
        HEAD_SHA: ${{ inputs.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run-id }}
      run: '"$GITHUB_ACTION_PATH/publish.sh"'
