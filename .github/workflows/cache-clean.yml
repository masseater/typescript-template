name: self-hosted-task-cache-clean

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  clean:
    if: vars.CI_RUNNER != ''
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - run: git clean -ffdx -e node_modules -e .local -e dist -e .wrangler -e .alchemy
      - run: rm -rf .local/d1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CEILING_PATHS: ${{ runner.workspace }}
        with:
          cache: false
      - env:
          SHARED_TASK_CACHE: ${{ vars.CI_TASK_CACHE_DIR }}
        run: vp run --filter @repo/quality clean:shared-task-cache
