name: cache-clean

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  clean:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - if: vars.CI_TASK_CACHE_DIR != ''
        env:
          SHARED_TASK_CACHE: ${{ vars.CI_TASK_CACHE_DIR }}
        run: |
          retired="${SHARED_TASK_CACHE}.retired.${GITHUB_RUN_ID}"
          if [ -d "$SHARED_TASK_CACHE" ]; then
            mv "$SHARED_TASK_CACHE" "$retired"
          fi
          mkdir -p "$SHARED_TASK_CACHE"
          rm -rf "$retired"
