name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to release
        required: false
        default: main

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
      - name: Check package versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/publish/versions.ts
      - if: steps.version.outputs.packages != ''
        run: vp run verify
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.packages != ''
        name: Pack
        env:
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: node .github/scripts/publish/pack.ts
      - if: steps.version.outputs.packages != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the release tag is free
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.packages != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: node .github/scripts/publish/release-tag.ts
      - if: steps.version.outputs.packages != ''
        name: Publish
        env:
          PACKAGES: ${{ steps.version.outputs.packages }}
        run: node .github/scripts/publish/npm-publish.ts

  tag:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Tag the release
        env:
          MODE: create
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: node .github/scripts/publish/release-tag.ts

  ci-telemetry:
    needs: [publish, tag]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: $/.github/actions/ci-telemetry
        with:
          github-token: ${{ github.token }}
