name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: deployment target
        type: choice
        options: [staging, production]
        default: staging

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
    secrets: inherit

  staging-removal-approval:
    needs: staging
    if: needs.staging.outputs.approval-stack != ''
    environment: staging-removal-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Approved $APPROVAL_STACK $APPROVAL_CONFIRMATION"
        env:
          APPROVAL_STACK: ${{ needs.staging.outputs.approval-stack }}
          APPROVAL_CONFIRMATION: ${{ needs.staging.outputs.approval-confirmation }}

  staging-approved:
    needs: [staging, staging-removal-approval]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ needs.staging.outputs.commit }}
      approval-stack: ${{ needs.staging.outputs.approval-stack }}
      approval-confirmation: ${{ needs.staging.outputs.approval-confirmation }}
    secrets: inherit

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      ref: main
    secrets: inherit

  production-removal-approval:
    needs: production
    if: needs.production.outputs.approval-stack != ''
    environment: production-removal-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Approved $APPROVAL_STACK $APPROVAL_CONFIRMATION"
        env:
          APPROVAL_STACK: ${{ needs.production.outputs.approval-stack }}
          APPROVAL_CONFIRMATION: ${{ needs.production.outputs.approval-confirmation }}

  production-approved:
    needs: [production, production-removal-approval]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      ref: ${{ needs.production.outputs.commit }}
      approval-stack: ${{ needs.production.outputs.approval-stack }}
      approval-confirmation: ${{ needs.production.outputs.approval-confirmation }}
    secrets: inherit
