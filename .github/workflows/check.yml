name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: &runner ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - &setup
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - &vite-task-cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_PATH: ${{ runner.temp }}/pr-files.txt
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, .previous_filename // empty' > "$PR_FILES_PATH" && vp run --filter @repo/dont-review-it pr-affected
      - if: steps.affected.outputs.scope == 'all'
        run: vp run -r prepr
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - if: steps.affected.outputs.scope == 'subset'
        run: vp run -w prepr
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - if: steps.affected.outputs.scope == 'subset'
        env:
          AFFECTED_FILTERS: ${{ steps.affected.outputs.filters }}
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: vp run --fail-if-no-match $AFFECTED_FILTERS prepr
      - if: steps.affected.outputs.scope == 'subset'
        env:
          AFFECTED_PATHS: ${{ steps.affected.outputs.paths }}
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: vp test run --passWithNoTests --project '!@repo/*' --exclude '**/*.dev-server.test.ts' $AFFECTED_PATHS
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  merge-queue-packages:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *vite-task-cache
      - run: vp run -r premerge
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  merge-queue-unit:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *vite-task-cache
      - run: vp run compile:paraglide
      - run: vp test run --project node --project node-isolated --project workers --shard=${{ matrix.shard }}/4
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}

  merge-queue:
    if: ${{ always() && startsWith(github.head_ref, 'mergify/merge-queue/') }}
    needs: [merge-queue-packages, merge-queue-unit]
    runs-on: *runner
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.merge-queue-packages.result }}" = "success"
          test "${{ needs.merge-queue-unit.result }}" = "success"

  e2e:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *vite-task-cache
      - run: vp run --filter @repo/e2e test:e2e
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}

  cache:
    if: github.event_name == 'push'
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - run: vp run -r prepr
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
