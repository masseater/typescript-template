name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: &runner ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - &setup
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - &beads
        run: |
          set -o pipefail
          version="$(sed -n 's/.*"github:gastownhall\/beads" = "\([^"]*\)".*/\1/p' mise.toml)"
          if [ -z "$version" ]; then
            echo "mise.toml does not pin github:gastownhall/beads" >&2
            exit 1
          fi
          case "${{ runner.arch }}" in
            X64) archive="beads_${version}_linux_amd64.tar.gz" ;;
            ARM64) archive="beads_${version}_linux_arm64.tar.gz" ;;
            *) echo "unsupported runner arch: ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          base="https://github.com/gastownhall/beads/releases/download/v${version}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep -F "  $archive" checksums.txt | sha256sum -c -
          tar -xzf "$archive" bd
          sudo install -m 755 bd /usr/local/bin/bd
          bd version
      - &vite-task-cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - run: vp check
      - run: vp run -r prepr
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  merge-queue:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *beads
      - *vite-task-cache
      - run: vp run -r premerge
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}

  e2e:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *vite-task-cache
      - run: vp run --filter @repo/e2e test:e2e
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}

  cache:
    if: github.event_name == 'push'
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *beads
      - run: vp check
      - run: vp run -r prepr
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
