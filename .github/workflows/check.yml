name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: &runner ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ vars.CI_RUNNER == '' }}
      - &clean-workspace
        if: vars.CI_RUNNER != ''
        run: git clean -ffdx -e node_modules -e .local -e dist -e .wrangler -e .alchemy -e .artifacts -e .spool
      - &reset-local-database
        if: vars.CI_RUNNER != ''
        run: rm -rf .local/d1
      - &browser-cache
        if: vars.CI_RUNNER == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - &setup
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: ${{ vars.CI_RUNNER == '' }}
      - &mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CEILING_PATHS: ${{ runner.workspace }}
        with:
          cache: ${{ vars.CI_RUNNER == '' }}
      - &vite-task-cache
        id: vite-task-cache
        if: vars.CI_RUNNER == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - &task-cache-share
        if: vars.CI_TASK_CACHE_DIR != ''
        env:
          SHARED_TASK_CACHE: ${{ vars.CI_TASK_CACHE_DIR }}
        run: |
          mkdir -p "$SHARED_TASK_CACHE" node_modules/.vite
          rm -rf node_modules/.vite/task-cache
          ln -s "$SHARED_TASK_CACHE" node_modules/.vite/task-cache
      - run: vp run -r prepr
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && vars.CI_RUNNER == ''
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  merge-queue:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - *checkout
      - *clean-workspace
      - *reset-local-database
      - *browser-cache
      - *setup
      - *mise
      - *vite-task-cache
      - *task-cache-share
      - run: vp run -r premerge

  e2e:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: *runner
    timeout-minutes: 45
    steps:
      - *checkout
      - *clean-workspace
      - *browser-cache
      - *setup
      - *mise
      - *vite-task-cache
      - *task-cache-share
      - run: vp run --filter @repo/e2e test:e2e

  cache:
    if: github.event_name == 'push' && vars.CI_RUNNER == ''
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - *checkout
      - *browser-cache
      - *setup
      - *mise
      - run: vp run -r prepr
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
