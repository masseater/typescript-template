name: up-to-date

on:
  pull_request:
    types:
      [opened, synchronize, reopened, ready_for_review, auto_merge_enabled, auto_merge_disabled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/auto-merge-gate
