name: mergify-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc # v1.3.0
        with:
          mergify_cli_version: 2026.9.16.1
      - name: Probe Mergify check-job / product state
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          report="$(mktemp)"
          summary() {
            printf '%s\n' "$*" | tee -a "$report" >> "$GITHUB_STEP_SUMMARY"
          }
          api() {
            local method="$1" path="$2" body="${3:-}"
            local tmp code
            tmp="$(mktemp)"
            if [ -n "$body" ]; then
              code="$(curl -sS -o "$tmp" -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer ${MERGIFY_TOKEN}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$body" \
                "https://api.mergify.com/v1${path}")" || code="curl-fail"
            else
              code="$(curl -sS -o "$tmp" -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer ${MERGIFY_TOKEN}" \
                -H "Accept: application/json" \
                "https://api.mergify.com/v1${path}")" || code="curl-fail"
            fi
            summary "### \`${method} ${path}\` → HTTP \`${code}\`"
            summary '```json'
            if [ -s "$tmp" ]; then
              if [ "$path" = "/application" ]; then
                cp "$tmp" /tmp/mergify-application.json
              fi
              tee -a "$report" >> "$GITHUB_STEP_SUMMARY" < "$tmp"
              summary ''
            else
              summary "(empty body)"
            fi
            summary '```'
            printf '%s' "$code"
          }

          summary "# Mergify probe"
          summary ""
          summary "- repository: \`$GITHUB_REPOSITORY\`"
          summary "- token present: \`$([ -n "${MERGIFY_TOKEN:-}" ] && echo yes || echo no)\`"
          summary "- token length: \`${#MERGIFY_TOKEN}\`"
          summary "- token prefix: \`${MERGIFY_TOKEN:0:4}\`"
          summary ""

          if [ -z "${MERGIFY_TOKEN:-}" ]; then
            summary "MERGIFY_TOKEN secret is missing"
            exit 1
          fi

          summary "## CLI"
          summary '```'
          mergify --version 2>&1 | tee -a "$report" >> "$GITHUB_STEP_SUMMARY" || true
          summary '```'

          summary "## Application key"
          app_code="$(api GET /application)"
          summary ""

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          summary "## Default products"
          api GET "/default_products/${owner}" >/dev/null
          summary ""

          summary "## Enable ci_insights on this repository"
          api PUT "/products/${owner}/${repo}" \
            '{"products":["ci_insights","merge_queue","workflow_automation","merge_protections"]}' >/dev/null
          summary ""

          summary "## Average CI runtime"
          api GET "/repos/${GITHUB_REPOSITORY}/stats/average_ci_runtime" >/dev/null
          summary ""

          summary "## Merge-queue checks outcome"
          api GET "/repos/${GITHUB_REPOSITORY}/stats/merge_queue_checks_outcome" >/dev/null
          summary ""

          summary "## Quarantines (ci-scope readable)"
          api GET "/ci/${owner}/repositories/${repo}/quarantines" >/dev/null
          summary ""

          summary "## Events via mergify CLI"
          summary '```'
          for type in product.enabled product.disabled action.queue.checks_start action.queue.checks_end action.queue.checks.change action.queue.checks_not_started ci_insights.job_retried; do
            summary "### $type"
            if [ -n "${PR_NUMBER:-}" ]; then
              mergify events -r "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --since 90d --type "$type" --limit 20 2>&1 | tee -a "$report" >> "$GITHUB_STEP_SUMMARY" || true
            else
              mergify events -r "$GITHUB_REPOSITORY" --since 90d --type "$type" --limit 20 2>&1 | tee -a "$report" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          summary '```'

          summary "## Config simulate"
          summary '```'
          if [ -n "${PR_URL:-}" ]; then
            mergify config simulate "$PR_URL" 2>&1 | tee -a "$report" >> "$GITHUB_STEP_SUMMARY" || true
          else
            summary "no pull request URL"
          fi
          summary '```'

          summary "## Queue show"
          summary '```'
          if [ -n "${PR_NUMBER:-}" ]; then
            mergify queue show -r "$GITHUB_REPOSITORY" "$PR_NUMBER" 2>&1 | tee -a "$report" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          summary '```'

          cp "$report" "$RUNNER_TEMP/mergify-probe-report.md"
          echo "MERGIFY_PROBE_REPORT=$RUNNER_TEMP/mergify-probe-report.md" >> "$GITHUB_ENV"

          scope="$(python3 - <<'PY'
import json,sys
try:
    print(json.load(open("/tmp/mergify-application.json"))["scope"])
except Exception:
    print("unknown")
PY
)" || scope="unknown"

          summary "## Conclusion"
          if [ "$app_code" != "200" ]; then
            echo "::error::MERGIFY_TOKEN was rejected by GET /application (HTTP ${app_code})."
            summary "MERGIFY_TOKEN rejected by /application (HTTP ${app_code})."
            exit 1
          fi
          summary "- application scope: \`$scope\`"
          if [ "$scope" = "ci" ]; then
            summary "- check-job metrics need the \`ci_insights\` product enabled in the Mergify GitHub Integration dashboard; a \`ci\` application key cannot PUT /products or read job/check event logs"
            echo "::notice::MERGIFY_TOKEN scope=ci (ok for test uploads). Enable ci_insights at https://dashboard.mergify.com/integrations/github for check-job metrics."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mergify-probe-report
          path: ${{ env.MERGIFY_PROBE_REPORT }}
          if-no-files-found: warn
