name: skills-lock

on:
  push:
    branches: ["renovate/**"]
    paths: [skills-lock.json]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - run: vp exec skills experimental_install --force --no-frozen-lockfile
      - id: changed
        run: |
          if git diff --quiet -- skills-lock.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): skills-lock.json のハッシュを新しい ref に合わせる" -- skills-lock.json
          gh auth setup-git
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh workflow run up-to-date.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  ci-telemetry:
    needs: [rehash]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
