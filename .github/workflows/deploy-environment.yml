name: deploy-environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
      approval-stack:
        type: string
        default: ""
      approval-confirmation:
        type: string
        default: ""
    outputs:
      commit:
        value: ${{ jobs.deploy.outputs.commit }}
      approval-stack:
        value: ${{ jobs.deploy.outputs.approval-stack }}
      approval-confirmation:
        value: ${{ jobs.deploy.outputs.approval-confirmation }}

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      approval-stack: ${{ steps.deploy.outputs.approval-stack }}
      approval-confirmation: ${{ steps.deploy.outputs.approval-confirmation }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - id: prepare
        run: vp run --filter @repo/infra-cloudflare prepare:ci-env
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          BUDGET_JPY: ${{ secrets.BUDGET_JPY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TEMPLATE_APP_DOMAIN: ${{ secrets.TEMPLATE_APP_DOMAIN }}
          TEMPLATE_AUTH_SECRET: ${{ secrets.TEMPLATE_AUTH_SECRET }}
          TEMPLATE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.TEMPLATE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          TEMPLATE_INTERNAL_DASHBOARD_ORIGIN: ${{ secrets.TEMPLATE_INTERNAL_DASHBOARD_ORIGIN }}
          TEMPLATE_MAIL_FROM: ${{ secrets.TEMPLATE_MAIL_FROM }}
          TEMPLATE_OTLP_AUTHORIZATION: ${{ secrets.TEMPLATE_OTLP_AUTHORIZATION }}
          TEMPLATE_OTLP_ENDPOINT: ${{ secrets.TEMPLATE_OTLP_ENDPOINT }}
          TEMPLATE_PREFIX: ${{ secrets.TEMPLATE_PREFIX }}
          TEMPLATE_SERVICE_ADMIN_ORIGIN: ${{ secrets.TEMPLATE_SERVICE_ADMIN_ORIGIN }}
          TEMPLATE_SERVICE_MEMBER_ORIGIN: ${{ secrets.TEMPLATE_SERVICE_MEMBER_ORIGIN }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          TEMPLATE_WIKI_PUBLISH_APP_ID: ${{ secrets.TEMPLATE_WIKI_PUBLISH_APP_ID }}
          TEMPLATE_WIKI_PUBLISH_PRIVATE_KEY: ${{ secrets.TEMPLATE_WIKI_PUBLISH_PRIVATE_KEY }}
          TEMPLATE_WIKI_PUBLISH_REPOSITORY: ${{ secrets.TEMPLATE_WIKI_PUBLISH_REPOSITORY }}
      - id: deploy
        if: steps.prepare.outputs.configured == 'true' && inputs.approval-stack == ''
        run: vp run --filter @repo/infra-cloudflare deploy:ordered
      - if: steps.prepare.outputs.configured == 'true' && inputs.approval-stack != ''
        run: vp run --filter @repo/infra-github require:removal-approval "$APPROVAL_ENVIRONMENT"
        env:
          APPROVAL_ENVIRONMENT: ${{ inputs.environment }}-removal-approval
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.configured == 'true' && inputs.approval-stack != ''
        run: vp run --filter @repo/infra-cloudflare deploy:ordered --approve "$APPROVAL_STACK" "$APPROVAL_CONFIRMATION"
        env:
          APPROVAL_STACK: ${{ inputs.approval-stack }}
          APPROVAL_CONFIRMATION: ${{ inputs.approval-confirmation }}
      - if: steps.prepare.outputs.configured == 'true' && steps.deploy.outputs.approval-stack == ''
        run: vp run --filter @repo/infra-cloudflare probe:origins
