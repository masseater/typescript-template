name: prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ vars.CI_RUNNER == '' }}
      - if: vars.CI_RUNNER != ''
        run: git clean -ffdx -e node_modules -e .local -e dist -e .wrangler -e .alchemy -e .artifacts -e .spool
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: ${{ vars.CI_RUNNER == '' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CEILING_PATHS: ${{ runner.workspace }}
        with:
          cache: ${{ vars.CI_RUNNER == '' }}
      - run: vp run -r prerelease

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp run --filter @repo/local up
      - run: vp run --filter @repo/dev setup loopback
      - run: vp run --filter @repo/db db:migrate:local
      - run: vp run --filter @repo/user build
      - run: vp run --filter @repo/user preview &
      - run: vp run --filter @repo/load load user smoke
