name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm exec vp run verify
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
