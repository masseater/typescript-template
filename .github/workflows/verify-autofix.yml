name: verify-autofix

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: verify-autofix-${{ github.event.workflow_run.head_branch }}

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - id: target
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            branch="claude/fix-verify-$FAILED_RUN_ID"
            git switch -c "$branch"
          else
            branch="$HEAD_BRANCH"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - if: steps.target.outputs.stale != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - if: steps.target.outputs.stale != 'true'
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - if: steps.target.outputs.stale != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: renovate
          prompt: |
            The verify workflow failed on branch ${{ github.event.workflow_run.head_branch }} (run ${{ github.event.workflow_run.html_url }}).
            The working tree is checked out on branch ${{ steps.target.outputs.branch }}.

            1. Read the failure with `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
            2. Fix the root cause in the code, following AGENTS.md. Do not weaken lint rules, add disable directives, or skip checks to make verify pass.
            3. Run `pnpm exec vp run verify` and repeat until it passes.
            4. Commit the fix with a Conventional Commits message whose body explains the cause. Do not push.
          claude_args: >-
            --max-turns 200
            --model claude-opus-5-5
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
      - if: steps.target.outputs.stale != 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "::error::Claude did not commit a fix"
            exit 1
          fi
          git push --no-verify origin "HEAD:refs/heads/$BRANCH"
          if [ "$BRANCH" != "$HEAD_BRANCH" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --draft \
              --title "$(git log -1 --format=%s)" \
              --body "Fixes verify failure $FAILED_RUN_URL" ||
              echo "::warning::Could not open a pull request; open one from $BRANCH manually"
          fi
          gh workflow run verify.yml --ref "$BRANCH"
