name: load

on:
  workflow_dispatch:
    inputs:
      profile:
        description: load profile
        type: choice
        options: [smoke, peak]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - run: vp run --filter @template/local up
      - run: vp run --filter @template/dev setup loopback
      - run: vp run --filter @template/db db:migrate:local
      - run: vp run --filter @template/user build
      - run: vp run --filter @template/user preview &
      - run: vp run --filter @template/load load user ${{ inputs.profile }}
