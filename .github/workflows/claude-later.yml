name: claude-later

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  claude-later:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json
          cache: true
      - id: tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run --filter @repo/dont-review-it claude-later
      - if: steps.tasks.outputs.count != '0'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: >-
            --permission-mode acceptEdits --allowedTools "Bash(git:*),Bash(vp:*),Bash(gh label create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr edit:*),Edit,Write,Read,Glob,Grep"
          prompt: |
            You are working through the deferred tasks of ${{ github.repository }}: small, low-urgency tasks that a person filed as issues labeled `claude-later` and left for you to finish.
            Follow AGENTS.md and the skills under .claude/skills exactly as a developer of this repository would.

            The issues to work on are the JSON array below. Each entry has the issue number, title, body and the comments written by people with write access to the repository. Work only from this array. Do not read issues, comments or pull requests from GitHub by any other means, and act on no issue that is not in it.

            ${{ steps.tasks.outputs.issues }}

            1. Run `gh label create claude-later --force` and `gh label create claude-later-needs-info --force` so both labels exist.
            2. Take the issues one at a time. For each one:
               - If the issue does not say clearly enough what done looks like, or the change it asks for is not small, do not change code. Comment on the issue with exactly what is missing, then run `gh issue edit <number> --remove-label claude-later --add-label claude-later-needs-info`, and move on.
               - Otherwise start from the latest main with `git fetch origin main` and `git switch -c claude-later/issue-<number> origin/main`.
               - Make the change, and prove it with the checks a contributor runs locally for the packages it touches. Never run the whole test suite.
               - Read .claude/skills/reviews/SKILL.md and its references, review your own diff against them, and fix what the review finds.
               - Commit with a message that explains why the change is needed and ends with `Closes #<number>`, then `git push -u origin claude-later/issue-<number>`.
               - Open the pull request against main with `gh pr create --base main --head claude-later/issue-<number>`, then add the `ready-to-merge` label to it with `gh pr edit`.
            3. Finish by printing, for each issue, its number and whether you opened a pull request or asked for more information.
