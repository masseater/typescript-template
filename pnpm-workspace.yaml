packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  effect@*: "catalog:"
  "@effect/platform-node-shared@*": 4.0.0-rc.112
allowBuilds:
  esbuild: true
  workerd: true
  vite-plus: true
  "@parcel/watcher": true
  canvas: false
  msw: false
  protobufjs: true
  agent-browser: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.10"
  - "@cloudflare/workers-types@5.20260916.1"
  - miniflare@5.20260915.0-alpha
  - wrangler@4.132.0
catalog:
  "@better-auth/passkey": 1.7.5
  "@cloudflare/vite-plugin": 1.54.10
  "@cloudflare/workers-types": 5.20260916.1
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  "@pulumi/cloudflare": 6.20.0
  "@pulumi/pulumi": 3.262.0
  "@tanstack/react-router": 1.170.36
  "@tanstack/react-start": 1.168.54
  "@types/node": 24.12.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  better-auth: 1.7.5
  effect: 4.0.0-rc.112
  msw: 2.15.0
  react: 19.3.0
  react-dom: 19.3.0
  smarthr-ui: 99.6.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  vitest: 4.1.11
  wrangler: 4.132.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "@better-auth/oauth-provider@1.7.5": patches/@better-auth__oauth-provider@1.7.5.patch
