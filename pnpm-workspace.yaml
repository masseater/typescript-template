packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  effect@*: 4.0.0-rc.112
  "@effect/platform-node-shared@*": 4.0.0-rc.112
allowBuilds:
  esbuild: true
  workerd: true
  vite-plus: true
  "@parcel/watcher": true
  canvas: false
  msw: false
  protobufjs: true
  agent-browser: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.10"
  - "@cloudflare/workers-types@5.20260916.1"
  - miniflare@5.20260915.0-alpha
  - wrangler@4.132.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 4.1.11
  vite-plus: 0.3.2
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "@better-auth/oauth-provider@1.7.5": patches/@better-auth__oauth-provider@1.7.5.patch
