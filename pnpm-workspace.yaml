packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": 24.19.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
  protobufjs: false
