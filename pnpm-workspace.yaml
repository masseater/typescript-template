packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.0-rc.118
  "@effect/tsgo": 0.46.1
  "@eslint-react/eslint-plugin": 5.21.1
  "@shadcn/lint": 0.2.0
  "@tanstack/eslint-plugin-query": 5.104.0
  "@tanstack/eslint-plugin-router": 1.162.0
  "@types/node": 24.19.0
  effect: 4.0.0-rc.118
  eslint-plugin-drizzle: 0.2.3
  eslint-plugin-react-hooks: 7.1.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
  eslint-plugin-react-hooks>zod-validation-error: ^4.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
  protobufjs: false
packageExtensions:
  "@feature-sliced/steiger-plugin@0.8.0":
    dependencies:
      "@steiger/toolkit": 0.2.3
